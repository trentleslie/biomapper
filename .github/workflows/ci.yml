name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: poetry

      - name: Install dependencies
        run: poetry install --no-interaction --all-extras

      - name: Lint (ruff)
        run: poetry run ruff check .

      - name: Type check (mypy --strict)
        run: poetry run mypy src/biomapper/

      - name: Tests (pytest + coverage)
        run: poetry run pytest

      # Checks the BUILT wheel, not the source config or this job's environment. Both of those can
      # be healthy while the published artifact is broken: 1.5.2 shipped four extras that gated no
      # requirements, and this job stayed green because `poetry install --all-extras` also installs
      # every non-optional group. An advertised-but-empty extra is worse than an absent one,
      # because `pip install biomapper[benchmarks]` succeeds and fails at first import instead.
      - name: Built wheel advertises no empty extras
        run: poetry run python scripts/check_wheel_extras.py
